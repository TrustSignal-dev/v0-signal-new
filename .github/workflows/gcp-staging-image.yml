name: Publish GCP staging web image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-staging-web-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: us-east5-docker.pkg.dev/trustsignal-shared-2026/trustsignal/trustsignal-web:staging-${{ github.sha }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: auth
        name: Authenticate to TrustSignal GCP through OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/591163249261/locations/global/workloadIdentityPools/trustsignal-github/providers/web-main
          service_account: trustsignal-web-deploy@trustsignal-staging-2026.iam.gserviceaccount.com

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker us-east5-docker.pkg.dev --quiet

      - name: Build immutable staging image
        run: |
          docker build --pull \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --tag "$IMAGE" \
            .

      - name: Push immutable staging image
        run: docker push "$IMAGE"

      - name: Record provenance
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          {
            echo "## TrustSignal web staging image"
            echo "- source: \`${GITHUB_REPOSITORY}@${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- image: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
